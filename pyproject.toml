[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pypwdft"
version = "0.3.0"
authors = [
  { name="Ivo Filot", email="ivo@ivofilot.nl" }
]
maintainers = [
    { name="Ivo Filot", email="ivo@ivofilot.nl" },
]
description = "Educational pure-Python plane-wave density functional theory code"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = [
    "LICENSE",
    "pypwdft/psp/LICENSE.eminus",
    "pypwdft/psp/NOTICE",
]
keywords = ["density functional theory", "plane waves", "pseudopotentials", "quantum chemistry", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "scipy",
    "numpy",
    "pyfftw",
    "threadpoolctl",
    "matplotlib",
]

[project.optional-dependencies]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["pypwdft*"]

[project.urls]
"Homepage" = "https://www.github.com/ifilot/pypwdft"
"Documentation" = "https://ifilot.github.io/pypwdft/"
"Bug Tracker" = "https://www.github.com/ifilot/pypwdft/issues"
"Changelog" = "https://github.com/ifilot/pypwdft/blob/master/CHANGELOG.md"
